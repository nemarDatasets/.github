name: Run BIDS Validation

# Central BIDS validation workflow for NEMAR datasets.
#
# Phase 4 of nemarOrg/nemar-cli#601 (sub-issue #610). Sibling to
# run-enrichment.yml, run-version-doi.yml, and run-generate-archive.yml.
#
# Unlike Phases 1-3, the PR-triggered workflows can't be relocated
# directly because GitHub's pull_request events fire only in the repo
# where the PR lives. The dataset repos each carry a thin shim that
# fires `repository_dispatch[run-bids-validation]` here; this workflow
# does the real work and posts the result back as a check-run on the
# dataset repo's PR via the GitHub Checks API.
#
# Operator-facing UX: the PR sees the shim's quick green check (just
# the dispatch call) plus a separate `Run BIDS Validation` check-run
# whose conclusion mirrors the validator output. The two-check pattern
# matches how composite GitHub Apps typically report results.

on:
  repository_dispatch:
    types: [run-bids-validation]
  workflow_dispatch:
    inputs:
      dataset_id:
        description: "Dataset id (e.g. nm099999)"
        required: true
        type: string
      ref:
        description: "Branch or ref the validation runs against"
        required: false
        type: string
        default: "main"
      head_sha:
        description: "Commit SHA to validate; required to attach the check-run to the right commit"
        required: true
        type: string
      pr_number:
        description: "PR number for log/summary linkback (optional)"
        required: false
        type: string
        default: ""
      validator_version:
        description: "BIDS validator version (must match nemar-cli's validator-version.json pin). REQUIRED for manual dispatch — the per-repo shim sets it automatically for repository_dispatch."
        required: true
        type: string

jobs:
  validate:
    name: BIDS Validation
    runs-on: ubuntu-latest
    # Validator time grows with file count: nm000359 (22.5k files) needs ~12 min of one
    # fast core, i.e. >20 min on a hosted runner. 120 min stays far below GitHub's 360.
    timeout-minutes: 120
    permissions: {}
    env:
      DATASET_ID: ${{ github.event.client_payload.dataset_id || inputs.dataset_id }}
      REF: ${{ github.event.client_payload.ref || inputs.ref || 'main' }}
      HEAD_SHA: ${{ github.event.client_payload.head_sha || inputs.head_sha }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number || '' }}
      # The shim on each dataset repo populates client_payload.validator_version
      # from the CLI's `validator-version.json` pin at template-deploy
      # time (Phase 4 of #601). For manual `workflow_dispatch` runs the
      # operator must supply `validator_version` explicitly — there's
      # deliberately no hardcoded fallback so a future bump of the CLI
      # pin can't silently leave this workflow running an old version.
      # The "Validate inputs" step below errors loudly if the resolved
      # value is empty. Code-review #13.
      VALIDATOR_VERSION: ${{ github.event.client_payload.validator_version || inputs.validator_version || '' }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [ -z "$DATASET_ID" ]; then
            echo "::error::Missing dataset_id"
            exit 1
          fi
          case "$DATASET_ID" in
            nm[0-9][0-9][0-9][0-9][0-9][0-9]|on[0-9][0-9][0-9][0-9][0-9][0-9]|xx[0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *)
              echo "::error::Invalid dataset_id shape: $DATASET_ID (expected nm/on/xx + 6 digits)"
              exit 1
              ;;
          esac
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Missing head_sha — the check-run needs a commit to attach to"
            exit 1
          fi
          if [ -z "$VALIDATOR_VERSION" ]; then
            echo "::error::Missing validator_version. The per-repo shim populates this from nemar-cli's validator-version.json pin via repository_dispatch. For a manual workflow_dispatch, pass it explicitly: gh workflow run run-bids-validation.yml -f validator_version=2.4.1 ..."
            exit 1
          fi
          # Sanity-check semver shape so a typo'd value can't make it
          # to `deno run jsr:@bids/validator@...` where the failure mode
          # is a 30-second download attempt that times out.
          case "$VALIDATOR_VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Invalid validator_version shape: $VALIDATOR_VERSION (expected X.Y.Z)"
              exit 1
              ;;
          esac

      - name: Mint per-repo App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NEMAR_APP_ID }}
          private-key: ${{ secrets.NEMAR_APP_PRIVATE_KEY }}
          owner: nemarDatasets
          repositories: ${{ env.DATASET_ID }}

      - name: Create in-progress check-run on the dataset repo
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Make the PR show a pending check immediately, so the
          # reviewer sees that validation is running. We complete this
          # check-run from the final step regardless of success/failure.
          DETAILS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_HINT=""
          if [ -n "$PR_NUMBER" ]; then
            PR_HINT=" (PR #$PR_NUMBER)"
          fi
          CHECK_ID=$(gh api -X POST "repos/nemarDatasets/$DATASET_ID/check-runs" \
            -f name='Run BIDS Validation' \
            -f head_sha="$HEAD_SHA" \
            -f status=in_progress \
            -f "output[title]=BIDS validation in progress$PR_HINT" \
            -f "output[summary]=Running deno BIDS validator on $HEAD_SHA. See [run logs]($DETAILS_URL) for live output." \
            --jq '.id')
          echo "check_id=$CHECK_ID" >> "$GITHUB_OUTPUT"
          echo "Created check-run $CHECK_ID for $DATASET_ID@$HEAD_SHA"

      - name: Checkout target dataset repo at head_sha
        uses: actions/checkout@v4
        with:
          repository: nemarDatasets/${{ env.DATASET_ID }}
          ref: ${{ env.HEAD_SHA }}
          token: ${{ steps.app-token.outputs.token }}
          # The token is used for this fetch only and is not left in the checkout's
          # git config; the git-annex fetch below passes it per command instead.
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Fetch git-annex branch for annexed content
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # With the git-annex branch present, bids-validator 3.0.2 resolves an
          # annexed SYMLINK per key: when the branch holds `<hashdir>/<key>.log.rmet`
          # it reads the content over that special remote's public URL, so rules see
          # a real file. Any other symlink, and every pointer FILE, stays empty to
          # the validator; "Collect git-annex pointer files" works out which, and
          # the filter in "Check validation result" covers them. Best-effort.
          # The token goes in through git's env config, not argv.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          if GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="$AUTH" \
               git fetch --quiet --depth 1 \
               "https://github.com/nemarDatasets/${DATASET_ID}.git" git-annex:git-annex; then
            echo "Fetched the git-annex branch"
          else
            echo "No git-annex branch fetched; annexed content stays unreadable"
          fi

      - name: Run BIDS validator
        id: validator
        run: |
          set -euo pipefail
          mkdir -p .nemar
          grep -qxF '.nemar/' .bidsignore 2>/dev/null || echo '.nemar/' >> .bidsignore
          # VALIDATOR_VERSION is wired via env (job-level), populated by
          # client_payload from the shim (which interpolates the CLI's
          # validator-version.json pin at template-deploy time). Manual
          # workflow_dispatch can override via the validator_version input.
          echo "Running BIDS validator @${VALIDATOR_VERSION}"
          deno run -A "jsr:@bids/validator@${VALIDATOR_VERSION}" . --json --ignoreWarnings --max-rows -1 > .nemar/validation.json || true
          cat .nemar/validation.json

      - name: Collect git-annex pointer files
        run: |
          set -euo pipefail
          # ANNEX_DIR is overridable only so scripts/test_bids_annex_filter.py can
          # drive this step and the next against fixtures.
          ANNEX_DIR="${ANNEX_DIR:-/tmp}"
          FIND=$(command -v gfind || echo find)
          # All annex pointers: symlinks (path<TAB>target), plus small files
          # holding an annex path.
          "$FIND" . -type l -not -path './.git/*' -printf '/%P\t%l\n' > "$ANNEX_DIR/annex-links.tsv" 2>/dev/null || true
          "$FIND" . -type f -not -path './.git/*' -size -1024c -exec grep -l '^/annex/objects/' {} + 2>/dev/null | sed 's|^\./|/|' > "$ANNEX_DIR/annex-pointer-files.txt" || true
          { cut -f1 "$ANNEX_DIR/annex-links.tsv"; cat "$ANNEX_DIR/annex-pointer-files.txt"; } | sort -u > "$ANNEX_DIR/annex-files.txt"
          # Pointers whose content the validator could NOT read: every pointer
          # FILE (3.0.2 only resolves symlinks), and every symlink whose key has no
          # `<hashdir>/<key>.log.rmet` on the fetched git-annex branch (the
          # validator then falls back to an empty file without any error).
          : > "$ANNEX_DIR/annex-rmet-keys.txt"
          if git rev-parse --verify -q refs/heads/git-annex > /dev/null; then
            git ls-tree -r --name-only git-annex | awk -F/ '/\.log\.rmet$/ { sub(/\.log\.rmet$/, "", $NF); print $NF }' | sort -u > "$ANNEX_DIR/annex-rmet-keys.txt"
          fi
          {
            cat "$ANNEX_DIR/annex-pointer-files.txt"
            awk -F'\t' 'FILENAME == ARGV[1] { have[$0] = 1; next } { n = split($2, a, "/"); if (!(a[n] in have)) print $1 }' \
              "$ANNEX_DIR/annex-rmet-keys.txt" "$ANNEX_DIR/annex-links.tsv"
          } | sort -u > "$ANNEX_DIR/annex-unresolved.txt"
          ANNEX_COUNT=$(wc -l < "$ANNEX_DIR/annex-files.txt" | tr -d ' ')
          UNRESOLVED_COUNT=$(wc -l < "$ANNEX_DIR/annex-unresolved.txt" | tr -d ' ')
          if [ "$ANNEX_COUNT" -gt 0 ]; then
            echo "Found $ANNEX_COUNT git-annex pointer file(s), $UNRESOLVED_COUNT without readable content (filtered by rule below)"
          fi

      - name: Check validation result
        id: result
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          ANNEX_DIR="${ANNEX_DIR:-/tmp}"
          # Markdown error detail surfaced on the dataset-repo check-run
          # (output[text]) so PR authors can read failures in their own repo's
          # Checks tab without opening the central run logs. Stays empty unless
          # real errors are found; the finalize step reads it via --rawfile.
          : > /tmp/error-details.md
          if [ ! -f .nemar/validation.json ] || ! jq empty .nemar/validation.json 2>/dev/null; then
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "summary=BIDS validator failed to produce valid output" >> "$GITHUB_OUTPUT"
            printf '%s\n' "The BIDS validator did not produce parseable output. See the linked central run logs for details." > /tmp/error-details.md
            echo "::error::BIDS validator failed to produce valid output"
            exit 0
          fi

          for f in annex-files annex-unresolved; do
            if [ -s "$ANNEX_DIR/$f.txt" ]; then
              jq -R -s 'split("\n") | map(select(length > 0))' "$ANNEX_DIR/$f.txt" > "$ANNEX_DIR/$f.json"
            else
              echo '[]' > "$ANNEX_DIR/$f.json"
            fi
          done

          # WHAT IS FILTERED, AND WHY.
          # The checkout has no annexed content. Where the validator cannot read an
          # annexed file (see annex-unresolved.txt, built by the collect step) it
          # sees an EMPTY file (bids-validator 3.0.2 NullFileOpener), so rules that
          # look inside it fire on nothing, and rules that INHERIT from an empty
          # .json sidecar report its keys missing on the data files too.
          # Every error is classified, in this order:
          #   skipped     (d) a SIDECAR_KEY_* error, at ANY location, when an
          #                   unreadable annexed .json could be the sidecar (same or
          #                   ancestor directory, same suffix): the keys it would
          #                   supply are unknown. Evaluated first because the data
          #                   file itself may be git-tracked or readable.
          #   real        not located on an annex file (and not rule d): kept.
          #   skipped     (a) FILE_READ on an annex file: the content could not be
          #                   read. The location is then also treated as unreadable
          #                   below (the validator carries on with empty content).
          #   annex_real  located on an annex file whose content WAS readable: kept.
          #   skipped     (b) unreadable, and the code is in ANNEX_CONTENT_READ_CODES;
          #               (c) unreadable .json/.tsv/.tsv.gz/.bval/.bvec (they are rule
          #                   INPUTS, so empty means every column or key looks
          #                   missing) and the code is not in ANNEX_PATH_ONLY_CODES.
          #   annex_real  everything else on an annex file: kept, and counted
          #               separately ("located on annex files").
          #
          # ANNEX_CONTENT_READ_CODES: codes bids-validator raises only from reading
          # a file's bytes or header (jsr:@bids/validator@3.0.2, src/):
          #   NIFTI_HEADER_UNREADABLE   files/nifti.ts loadHeader (readBytes 1024)
          #   AMBIGUOUS_AFFINE          schema/context.ts loadNiftiHeader (parsed header)
          #   INVALID_GZIP              files/tsv.ts loadHeaderlessTSV (gunzip of .tsv.gz)
          #   INVALID_FILE_ENCODING     files/streams.ts (UTF-8 decode of content)
          #   INVALID_JSON_ENCODING     files/json.ts loadJSON (UTF-8 decode)
          #   JSON_INVALID              files/json.ts loadJSON (JSON.parse of content)
          #   JSON_NOT_AN_OBJECT        files/json.ts loadJSON (parsed content)
          #   TSV_EMPTY_LINE            files/tsv.ts loadColumns (row scan of content)
          #   TSV_EQUAL_ROWS            files/tsv.ts loadColumns (row scan of content)
          #   TSV_COLUMN_HEADER_DUPLICATE  files/tsv.ts (header row of content)
          # (FILE_READ, files/access.ts, is rule (a).) EMPTY_FILE is path-only: the
          # validator takes an annexed file's size from the annex key, not bytes.
          # Do not add a code here unless it needs the file's content.
          ANNEX_CONTENT_READ_CODES='["NIFTI_HEADER_UNREADABLE","AMBIGUOUS_AFFINE","INVALID_GZIP","INVALID_FILE_ENCODING","INVALID_JSON_ENCODING","JSON_INVALID","JSON_NOT_AN_OBJECT","TSV_EMPTY_LINE","TSV_EQUAL_ROWS","TSV_COLUMN_HEADER_DUPLICATE"]'
          # ANNEX_PATH_ONLY_CODES: judged from the file path alone, so a missing
          # content cannot cause them; they stay real even on unreadable files.
          ANNEX_PATH_ONLY_CODES='["NOT_INCLUDED","INVALID_LOCATION","FILENAME_MISMATCH","ENTITY_NOT_IN_RULE","ENTITY_WITH_NO_LABEL","MISSING_REQUIRED_ENTITY","DATATYPE_MISMATCH","EXTENSION_MISMATCH","ALL_FILENAME_RULES_HAVE_ISSUES","INVALID_ENTITY_LABEL","CASE_COLLISION","SIDECAR_WITHOUT_DATAFILE","SYMLINK_BROKEN","SYMLINK_CYCLE","SYMLINK_OUT_OF_TREE","SYMLINK_IN_SUBMODULE","EMPTY_FILE"]'

          # shellcheck disable=SC2016
          jq --slurpfile annexed "$ANNEX_DIR/annex-files.json" \
             --slurpfile unresolved "$ANNEX_DIR/annex-unresolved.json" \
             --argjson codes "$ANNEX_CONTENT_READ_CODES" \
             --argjson pathonly "$ANNEX_PATH_ONLY_CODES" '
            def idx: map({key: ., value: true}) | from_entries;
            def dirname: sub("/[^/]*$"; "");
            def suffix: split("/") | last | split(".")[0] | split("_") | last;
            def input_file: test("\\.(json|tsv|tsv\\.gz|bval|bvec)$");
            ($annexed[0] | idx) as $A
            # FILE_READ on an annex file: the validator went on with empty content.
            | ([.issues.issues[] | select(.severity == "error" and .code == "FILE_READ") | .location // empty | select($A[.] // false)]) as $failed
            | (($unresolved[0] + $failed) | unique) as $unreadable
            | ($unreadable | idx) as $U
            | ($unreadable | map(select(input_file))) as $AT
            | ($AT | idx) as $ATI
            | ($AT | map(select(endswith(".json")))) as $ATJ
            | def has_sidecar($l):
                ($l | suffix) as $s | (($l | dirname) + "/") as $d
                | any($ATJ[]; . as $j | endswith("_" + $s + ".json") and ($d | startswith(($j | dirname) + "/")));
              def classify:
                (.location // "") as $l | .code as $c
                | if ($c | startswith("SIDECAR_KEY_")) and has_sidecar($l) then "skipped"
                  elif ($A[$l] // false) | not then "real"
                  elif $c == "FILE_READ" then "skipped"
                  elif ($U[$l] // false) | not then "annex_real"
                  elif ($codes | index($c)) != null then "skipped"
                  elif ($ATI[$l] // false) and (($pathonly | index($c)) == null) then "skipped"
                  else "annex_real" end;
              [.issues.issues[] | select(.severity == "error") | . + {annexClass: classify}]
          ' .nemar/validation.json > "$ANNEX_DIR/errors-classified.json"

          REAL_ERRORS=$(jq '[.[] | select(.annexClass != "skipped")] | length' "$ANNEX_DIR/errors-classified.json")
          ANNEX_ERRORS=$(jq '[.[] | select(.annexClass == "skipped")] | length' "$ANNEX_DIR/errors-classified.json")
          ANNEX_LOCATED=$(jq '[.[] | select(.annexClass == "annex_real")] | length' "$ANNEX_DIR/errors-classified.json")
          WARNINGS=$(jq '[.issues.issues[] | select(.severity == "warning")] | length' .nemar/validation.json)
          STATS="skipped $ANNEX_ERRORS annex-pointer error(s) that need file content; $ANNEX_LOCATED of the reported error(s) are located on annex files"

          echo "real_errors=$REAL_ERRORS" >> "$GITHUB_OUTPUT"
          echo "annex_errors=$ANNEX_ERRORS" >> "$GITHUB_OUTPUT"
          echo "annex_located_errors=$ANNEX_LOCATED" >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"

          if [ "$REAL_ERRORS" -gt 0 ]; then
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "summary=BIDS validation found $REAL_ERRORS error(s), $WARNINGS warning(s) ($STATS)." >> "$GITHUB_OUTPUT"
            echo "::error::BIDS validation found $REAL_ERRORS error(s) ($STATS)"
            # Build the human-readable error detail (grouped-by-code summary +
            # capped detail table) for the check-run output[text]. Capped to
            # stay well under GitHub's 64KB output limit; never fails the step.
            jq -r '
              [.[] | select(.annexClass != "skipped")] as $errs
              | ($errs | length) as $n
              | ([$errs[].code] | group_by(.) | map({code: .[0], count: length}) | sort_by(-.count)) as $bycode
              | "### BIDS validation errors\n\n"
                + "**\($n) error(s)** across **\($bycode | length) code(s)**:\n\n"
                + ($bycode[:25] | map("- `\(.code)` x \(.count)") | join("\n"))
                + (if ($bycode | length) > 25 then "\n- ...and \(($bycode | length) - 25) more code(s)" else "" end)
                + "\n\n<details><summary>First \([$n, 50] | min) error(s)</summary>\n\n"
                + "| File | Code | Detail |\n|---|---|---|\n"
                + ($errs[:50] | map(
                    "| `\(.location // "-")` | `\(.code)\(if .subCode then " / " + .subCode else "" end)` | \((.issueMessage // "") | gsub("[\n|]"; " ") | .[0:140]) |"
                  ) | join("\n"))
                + "\n\n</details>"
                + (if $n > 50 then "\n\n_...and \($n - 50) more error(s) not shown; full report in the linked central run._" else "" end)
            ' "$ANNEX_DIR/errors-classified.json" > /tmp/error-details.md || true
            # Also echo the raw error objects to the central run log.
            jq '[.[] | select(.annexClass != "skipped")][]' "$ANNEX_DIR/errors-classified.json"
            exit 0
          fi
          echo "outcome=success" >> "$GITHUB_OUTPUT"
          echo "summary=BIDS validation passed: $WARNINGS warning(s) ($STATS)." >> "$GITHUB_OUTPUT"
          echo "BIDS validation passed ($WARNINGS warning(s); $STATS)"

      - name: Finalize check-run on the dataset repo
        if: always() && steps.check.outputs.check_id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECK_ID: ${{ steps.check.outputs.check_id }}
          OUTCOME: ${{ steps.result.outputs.outcome }}
          SUMMARY: ${{ steps.result.outputs.summary }}
        run: |
          set -euo pipefail
          # Map our internal outcome to the GitHub check-run conclusion
          # enum. If outcome is empty (early failure before the validator
          # step ran), report failure with a generic message.
          if [ -z "$OUTCOME" ]; then
            CONCLUSION="failure"
            TITLE="BIDS validation could not complete"
            SUMMARY="${SUMMARY:-The validation step did not produce a result; see the central workflow run for details.}"
          elif [ "$OUTCOME" = "success" ]; then
            CONCLUSION="success"
            TITLE="BIDS validation passed"
          else
            CONCLUSION="failure"
            TITLE="BIDS validation failed"
          fi
          DETAILS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FULL_SUMMARY="$SUMMARY"$'\n\n'"[View central run logs]($DETAILS_URL)"
          # Attach the error detail (built by the result step) as output[text]
          # so PR authors see the actual errors on this repo's check. Build the
          # PATCH body as JSON to safely carry multi-line markdown; omit `text`
          # when empty (e.g. on success). --rawfile needs the file to exist.
          [ -f /tmp/error-details.md ] || : > /tmp/error-details.md
          jq -n \
            --arg conclusion "$CONCLUSION" \
            --arg title "$TITLE" \
            --arg summary "$FULL_SUMMARY" \
            --rawfile text /tmp/error-details.md \
            '{status: "completed", conclusion: $conclusion,
              output: ({title: $title, summary: $summary}
                       + (if ($text | length) > 0 then {text: $text} else {} end))}' \
            | gh api -X PATCH "repos/nemarDatasets/$DATASET_ID/check-runs/$CHECK_ID" --input -
          echo "Finalized check-run $CHECK_ID -> $CONCLUSION"
