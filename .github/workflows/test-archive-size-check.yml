name: Test archive-size-check

# Runs scripts/test_archive_size_check.py on PRs touching scripts/.
# 16 real-subprocess assertions (no mocks): all three size tiers against
# the nm000284 incident shape, the file-count reason string, malformed and
# oversized payload fallthrough, fail-open, and the skip callback against a
# real HTTP server (success and failure).

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/test-archive-size-check.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/test-archive-size-check.yml"
  workflow_dispatch:

jobs:
  python-unit-test:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scripts tests
        run: python scripts/test_archive_size_check.py
