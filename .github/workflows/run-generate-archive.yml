name: Run Generate Archive

# Central archive-generation workflow for NEMAR datasets.
#
# Replaces the per-repo `.github/workflows/generate-archive.yml` that
# previously shipped to every dataset repo via `deployWorkflows()` in
# nemarOrg/nemar-cli. Phase 3 of nemarOrg/nemar-cli#601 (sub-issue #608).
# Sibling to `run-enrichment.yml` (Phase 1) and `run-version-doi.yml`
# (Phase 2).
#
# The legacy template was already `repository_dispatch`-driven, so this
# move is the lowest-friction of the centralization phases: the Worker
# helper `triggerArchiveGeneration` just retargets its POST URL from
# `repos/nemarDatasets/<dataset_id>/dispatches` to
# `repos/nemarDatasets/.github/dispatches` and adds `dataset_id` to the
# payload alongside the existing `version` field.
#
# Behavior is functionally identical to the legacy template — stream
# annex content directly from S3 into a zip and upload to
# `nemar/<dataset_id>/archives/v<X.Y.Z>.zip` via multipart upload, so
# disk usage stays constant regardless of dataset size.

on:
  repository_dispatch:
    types: [generate-archive]
  workflow_dispatch:
    inputs:
      dataset_id:
        description: "Dataset id (e.g. nm099999)"
        required: true
        type: string
      version:
        description: "Version (X.Y.Z, no leading v)"
        required: true
        type: string
      force:
        description: "Rebuild even if the archive already exists (recover a partial/corrupt zip)"
        required: false
        default: false
        type: boolean
      callback_url:
        description: "Callback URL (defaults to api.nemar.org/webhooks/archive-ready)"
        required: false
        type: string
        default: "https://api.nemar.org/webhooks/archive-ready"
      total_bytes:
        description: "Known total dataset bytes (#1514; optional, manual recovery/testing)"
        required: false
        type: string
      total_files:
        description: "Known total file count (#1514; optional, manual recovery/testing)"
        required: false
        type: string

# Dedupe concurrent dispatches for the same (dataset, version). cancel-in-progress
# false so a duplicate doesn't kill an in-flight build mid-multipart (the partial
# cleanup + idempotency guard handle a re-run); the duplicate queues behind.
concurrency:
  group: generate-archive-${{ github.event.client_payload.dataset_id || inputs.dataset_id }}-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

jobs:
  # Preflight (#752, hardened #1514): datasets over the size/file-count policy
  # skip the zip build entirely and steer users to the range-resumable
  # per-file direct download. Runs before the expensive checkout/stream job so
  # an oversized set never spins up a build that can't finish. Mirrors backend
  # archive-policy.ts.
  #
  # #1514 (nm000284): the version manifest this used to be the ONLY source for
  # is served only for a PUBLISHED, PUBLIC version (loadPublishedDataset), so
  # it 404s for a private dataset, an anonymous deposit before release, or a
  # version whose dataset_versions row hasn't landed yet -- exactly the window
  # nm000284's v1.0.0 and v1.0.1 dispatches landed in, and the preflight's old
  # single fail-open let a 512 GiB dataset through both times. Each step below
  # tries ONE source and writes bytes/files outputs on success (never failing
  # the job on its own miss, so the next tier gets a turn); the last step
  # (`archive-size-check.sh`) merges whichever tiers resolved, applies the
  # policy, and POSTs the skip callback -- unit-tested locally, see the PR:
  #   1. the manifest (unchanged, still the fast/common path once published)
  #   2. client_payload.total_bytes/total_files, sent by the Worker's
  #      dispatcher when it already knows the row's declared size, or
  #      forwarded by run-version-doi.yml's own dispatch when ITS
  #      client_payload carried them (the first-publish path, nemar-cli
  #      review finding #1/#6). Absent from an older backend, or from either
  #      dispatch path when neither had a number to offer.
  #   3. a same-job derivation: clone the dataset repo (a plain `git clone`
  #      never fetches git-annex content -- it lives out-of-band, referenced
  #      by symlinks/pointer files -- so this is cheap even for a 500 GB
  #      dataset) and run the SAME manifest emitter the publish pipeline uses
  #      (scripts/emit_manifest.py), reusing tested code rather than a second
  #      hand-rolled annex-key parser
  #   4. ADR 0012's fail-open, now the last resort instead of the only rule.
  preflight:
    name: Archive size preflight
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DATASET_ID: ${{ github.event.client_payload.dataset_id || inputs.dataset_id }}
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [ -z "$DATASET_ID" ] || [ -z "$VERSION" ]; then
            echo "::error::Missing dataset_id/version"
            exit 1
          fi

      - name: Checkout .github (for scripts/archive-size-check.sh)
        uses: actions/checkout@v4

      # Tier 1: the version manifest. Never fails the job -- a 404 or a
      # malformed body just leaves `bytes` unset so the next tier is tried.
      - name: Try the version manifest
        id: manifest
        run: |
          set +e
          if curl -fsS --connect-timeout 10 --max-time 120 \
               "https://data.nemar.org/${DATASET_ID}/v${VERSION}/manifest.json" \
               -o /tmp/archive-preflight-manifest.json; then
            if [ "$(jq -r 'type' /tmp/archive-preflight-manifest.json 2>/dev/null || echo invalid)" = "array" ]; then
              BYTES=$(jq '[.[].size // 0] | add // 0' /tmp/archive-preflight-manifest.json)
              FILES=$(jq 'length' /tmp/archive-preflight-manifest.json)
              echo "bytes=${BYTES}" >> "$GITHUB_OUTPUT"
              echo "files=${FILES}" >> "$GITHUB_OUTPUT"
              echo "manifest: ${BYTES} bytes, ${FILES} files"
            else
              echo "::warning::manifest is not a JSON array; trying the next size source"
            fi
          else
            echo "::warning::manifest unavailable; trying the next size source"
          fi
          exit 0

      # Resolves the dispatch payload's raw total_bytes/total_files ONCE, so
      # both the tier-3 gate below and the final decision step read the same
      # value instead of two copies of the same fallback expression drifting.
      # `||` is deliberately NOT used to combine the two sources: GitHub
      # Actions expression truthiness treats 0 as falsy, so a genuinely
      # zero-byte dataset's `client_payload.total_bytes: 0` would silently
      # fall through to `inputs.total_bytes` (review finding #7). Bash's
      # `${A:-B}` checks for unset-or-empty, not falsiness, and a JSON number
      # 0 interpolates as the STRING "0", which is non-empty -- so this picks
      # the first source that is actually PRESENT. Always runs; cheap.
      - name: Resolve dispatch payload totals
        id: payload-raw
        env:
          BYTES_EVENT: ${{ github.event.client_payload.total_bytes }}
          BYTES_INPUT: ${{ inputs.total_bytes }}
          FILES_EVENT: ${{ github.event.client_payload.total_files }}
          FILES_INPUT: ${{ inputs.total_files }}
        run: |
          echo "total_bytes=${BYTES_EVENT:-$BYTES_INPUT}" >> "$GITHUB_OUTPUT"
          echo "total_files=${FILES_EVENT:-$FILES_INPUT}" >> "$GITHUB_OUTPUT"

      # Tier 2 as a GATE for tier 3 (review finding #4): a cheap presence +
      # shape check, so the derivation's git clone and Python setup are
      # skipped whenever the dispatch payload already has something usable --
      # without this, tier 3 ran whenever tier 1 (the manifest) was empty,
      # which is the common case for exactly the private/pre-row datasets
      # tier 2 exists to cover, making "tier 2 is the cheap path" false in
      # practice. Mirrors is_uint() in archive-size-check.sh, which
      # re-validates independently regardless -- drift here only costs an
      # unnecessary (or wrongly skipped) derivation, never a wrong verdict.
      - name: Check whether the dispatch payload already has a usable size
        id: payload
        if: steps.manifest.outputs.bytes == ''
        env:
          PAYLOAD_TOTAL_BYTES: ${{ steps.payload-raw.outputs.total_bytes }}
        run: |
          case "$PAYLOAD_TOTAL_BYTES" in
            '' | *[!0-9]*) exit 0 ;;
          esac
          if [ "${#PAYLOAD_TOTAL_BYTES}" -le 18 ]; then
            echo "bytes=${PAYLOAD_TOTAL_BYTES}" >> "$GITHUB_OUTPUT"
          fi

      # Tier 3's derivation. Only attempted when BOTH tier 1 (the manifest)
      # and tier 2 (the dispatch payload) came up empty. Every step here is
      # best-effort (continue-on-error / internal `|| true`): a failure just
      # leaves `bytes` unset, which falls through to tier 4 in the final
      # check.
      - name: Mint per-repo App token for derivation
        id: derive-token
        if: steps.manifest.outputs.bytes == '' && steps.payload.outputs.bytes == ''
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NEMAR_APP_ID }}
          private-key: ${{ secrets.NEMAR_APP_PRIVATE_KEY }}
          owner: nemarDatasets
          repositories: ${{ env.DATASET_ID }}

      - name: Set up Python
        if: steps.manifest.outputs.bytes == '' && steps.payload.outputs.bytes == '' && steps.derive-token.outcome == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone dataset repo at tag (no annex content fetched)
        id: clone
        if: steps.manifest.outputs.bytes == '' && steps.payload.outputs.bytes == '' && steps.derive-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.derive-token.outputs.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/archive-preflight-repo
          git clone --quiet --depth 1 --branch "v${VERSION}" --no-checkout \
            "https://x-access-token:${GH_TOKEN}@github.com/nemarDatasets/${DATASET_ID}.git" \
            /tmp/archive-preflight-repo

      - name: Derive totals from the git tree
        id: derive
        if: steps.clone.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/archive-preflight-derive
          python scripts/emit_manifest.py \
            --dataset-id "$DATASET_ID" --version "$VERSION" \
            --repo-dir /tmp/archive-preflight-repo \
            --out-dir /tmp/archive-preflight-derive \
            --no-verify-canary
          BYTES=$(jq '.bytes' /tmp/archive-preflight-derive/totals.json)
          FILES=$(jq '.files' /tmp/archive-preflight-derive/totals.json)
          echo "bytes=${BYTES}" >> "$GITHUB_OUTPUT"
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"
          echo "derived: ${BYTES} bytes, ${FILES} files"

      # Always runs: picks the first tier that produced a number (manifest ->
      # dispatch payload -> derivation), applies the policy, and POSTs the
      # skip callback exactly as before #1514. All the fetching already
      # happened in the steps above; this one only merges and decides, which
      # is what makes it the part unit-tested locally (see the PR: three
      # sample runs of this exact script, manifest-present / payload-present /
      # everything-absent).
      - name: Check archive size policy
        id: check
        env:
          CALLBACK_TOKEN: ${{ secrets.NEMAR_WEBHOOK_TOKEN }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || inputs.callback_url || 'https://api.nemar.org/webhooks/archive-ready' }}
          MANIFEST_BYTES: ${{ steps.manifest.outputs.bytes }}
          MANIFEST_FILES: ${{ steps.manifest.outputs.files }}
          PAYLOAD_TOTAL_BYTES: ${{ steps.payload-raw.outputs.total_bytes }}
          PAYLOAD_TOTAL_FILES: ${{ steps.payload-raw.outputs.total_files }}
          DERIVED_BYTES: ${{ steps.derive.outputs.bytes }}
          DERIVED_FILES: ${{ steps.derive.outputs.files }}
        run: bash scripts/archive-size-check.sh

  archive:
    name: Generate Dataset Archive
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Streaming archive completes in single-digit minutes for typical datasets;
    # even a 250 GB upload finishes well under 30. The cap exists so a hung S3
    # multipart cannot pin the runner indefinitely.
    #
    # Raised from 60 (nemarOrg/nemar-cli#1038). 60 was calibrated on BYTES, and
    # file-count is the axis that actually binds: on004624 is only 19.3 GB but
    # 66,426 files, and at the old serial fetch rate needed ~3.4 h. It was killed
    # at 60 min on every attempt, and the delete-on-failure guard then removed
    # the partial, so the dataset had no archive at all. The prefetch window in
    # the stream script is the real fix; this raise is the backstop behind it.
    #
    # 330 is under GitHub's 360-minute hosted-runner ceiling with margin. Nothing
    # should approach it: with prefetching, the 200,000-file preflight limit is
    # roughly 80 minutes, which is why that limit needs no change here — it was
    # honest all along against a cap this size, and dishonest only against 60.
    timeout-minutes: 330
    # Defense-in-depth — every authenticated call goes through the
    # per-repo App token or the AWS credentials. The default
    # GITHUB_TOKEN is never used.
    permissions: {}
    env:
      DATASET_ID: ${{ github.event.client_payload.dataset_id || inputs.dataset_id }}
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [ -z "$DATASET_ID" ]; then
            echo "::error::Missing dataset_id"
            exit 1
          fi
          case "$DATASET_ID" in
            nm[0-9][0-9][0-9][0-9][0-9][0-9]|on[0-9][0-9][0-9][0-9][0-9][0-9]|xx[0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *)
              echo "::error::Invalid dataset_id shape: $DATASET_ID (expected nm/on/xx + 6 digits)"
              exit 1
              ;;
          esac
          if [ -z "$VERSION" ]; then
            echo "::error::Missing version"
            exit 1
          fi
          # Reject a leading v (the S3 key is constructed as v<bare> below);
          # callers must pass the bare X.Y.Z form, matching the legacy
          # per-repo workflow's expectation and the Worker's
          # triggerArchiveGeneration contract.
          case "$VERSION" in
            v*)
              echo "::error::Pass version without leading v (got $VERSION)"
              exit 1
              ;;
          esac

      - name: Mint per-repo App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NEMAR_APP_ID }}
          private-key: ${{ secrets.NEMAR_APP_PRIVATE_KEY }}
          owner: nemarDatasets
          repositories: ${{ env.DATASET_ID }}

      - name: Checkout target dataset repo at version tag
        uses: actions/checkout@v4
        with:
          repository: nemarDatasets/${{ env.DATASET_ID }}
          ref: v${{ env.VERSION }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install streaming dependencies
        run: |
          set -euo pipefail
          # The project policy (nemarOrg/nemar-cli CLAUDE.md) is bun for
          # all JS/TS work; ubuntu-latest doesn't ship bun, hence the
          # setup-bun step above. The archive script itself still runs
          # under Node 20 because the legacy CommonJS streaming script
          # targets it — bun is used only as the package installer here,
          # then NODE_PATH points `node` at the resulting node_modules.
          # Code-review #10.
          mkdir -p /tmp/archive-deps
          cd /tmp/archive-deps
          bun init -y > /dev/null
          # Pin to v7: v8+ is ESM-only, require() no longer returns the factory.
          bun add 'archiver@^7.0.1' '@aws-sdk/client-s3' '@aws-sdk/lib-storage'

      - name: Write archive script
        run: |
          cat > /tmp/stream-archive.js << 'ARCHIVE_SCRIPT'
          var fs = require("fs");
          var path = require("path");
          var S3Client = require("@aws-sdk/client-s3").S3Client;
          var GetObjectCommand = require("@aws-sdk/client-s3").GetObjectCommand;
          var Upload = require("@aws-sdk/lib-storage").Upload;
          var archiver = require("archiver");
          var PassThrough = require("stream").PassThrough;

          var DATASET_ID = process.env.DATASET_ID;
          var VERSION = process.env.VERSION;
          var BUCKET = "nemar";
          var REGION = process.env.AWS_DEFAULT_REGION || "us-east-2";

          function resolveAnnexKey(filePath) {
            try {
              var stat = fs.lstatSync(filePath);
              if (stat.isSymbolicLink()) {
                var target = fs.readlinkSync(filePath);
                var m = target.match(/([^\/]+)\/\1$/);
                if (m) return m[1];
                var m2 = target.match(/\/annex\/objects\/(.+)$/);
                if (m2) return m2[1];
              } else if (stat.isFile() && stat.size < 500 && stat.size > 20) {
                var content = fs.readFileSync(filePath, "utf8").trim();
                var m3 = content.match(/^\/annex\/objects\/(.+)$/);
                if (m3) return m3[1];
              }
            } catch (e) {
              console.warn("  resolveAnnexKey failed for " + filePath + ": " + e.message);
            }
            return null;
          }

          // Authenticated S3 read of an annex blob, with a small bounded
          // backoff for transient cold-start/throttle errors. Using signed
          // GetObject (the same AWS creds that write the zip) instead of an
          // anonymous public-URL GET removes the dependency on the dataset's
          // S3 public-access state: blobs read whether the prefix is public,
          // private, or mid-propagation right after a publish flip. This is
          // the bug behind the nm000111 incident (nemarOrg/nemar-cli#736),
          // where the publish cascade flipped public moments before this job
          // ran and every annexed blob 403'd against the not-yet-propagated
          // public policy, producing a hollow archive.
          //
          // The retry covers connect-time/HTTP errors (throttle, 5xx, 403/404)
          // since the body is not consumed until after this returns; a mid-
          // stream I/O error after archiver starts reading resp.Body is not
          // retried here at all.
          //
          // Such an error surfaces on BOTH handlers, not either/or: the
          // permanent archive.on("error") sets exitCode 1 directly, and the
          // per-file archive.once("error") rejects that entry's `entryDone`,
          // which is awaited inside the per-file try/catch and so also lands in
          // the skip path — counted `unreadable`, which independently fails the
          // build. Every listener on an EventEmitter fires for one emit; `once`
          // only means auto-removal. Both routes agree on the outcome (fail
          // red), so the redundancy is harmless, but do not read either handler
          // as the exclusive one.
          async function getAnnexObject(s3, key) {
            var lastErr;
            for (var attempt = 1; attempt <= 3; attempt++) {
              try {
                return await s3.send(new GetObjectCommand({ Bucket: BUCKET, Key: key }));
              } catch (e) {
                lastErr = e;
                // A 404 is authoritative: retrying cannot change the answer.
                // Since nemarOrg/nemar-cli#1038 an absent object is an expected,
                // permanent state for datasets whose upstream no longer holds
                // every declared file, so looping here would burn up to 1.5 s of
                // backoff per absent file on exactly the common case.
                if (isAbsentError(e)) throw e;
                if (attempt < 3) {
                  await new Promise(function (r) {
                    setTimeout(r, 500 * attempt);
                  });
                }
              }
            }
            throw lastErr;
          }

          // git-annex keys embed the content's byte size: MD5E-s11878096--<hash>.nii.gz,
          // SHA256E-s6488064--<hash>.fif. Returns null when no size can be read,
          // which disables the size check for that file (fail-open: an unparsed
          // key must not make a present object look hollow).
          //
          // Two distinct reasons a key yields null, deliberately handled the
          // same way. URL keys carry no size at all. WORM keys DO carry one, but
          // as WORM-s<size>-m<mtime>--<name> — the -m<mtime> sits between the
          // size and the --, so this regex does not match them either. Reading
          // WORM sizes would need its own pattern; not worth it, since NEMAR
          // content is MD5E/SHA256E and WORM appears only in hand-built repos.
          function declaredKeySize(key) {
            var m = /-s(\d+)--/.exec(key);
            if (!m) return null;
            var n = Number(m[1]);
            return Number.isFinite(n) ? n : null;
          }

          // The object at this key is not the content the key describes, so it
          // must not go into the archive under that name.
          //
          // git-annex keys are content-addressed: the size is part of the
          // identity, not metadata about it. Any mismatch means the bytes on
          // hand are some other content, whatever the cause, so the check is
          // deliberately a plain inequality rather than a 0-byte test.
          //
          // The motivating case is undersized: a failed import leaves a 0-byte
          // object at a valid key (the nemarOrg/nemar-cli#967 empty-PUT
          // signature — curl wrote an empty file on a 403 and it was uploaded
          // anyway), GetObject SUCCEEDS, and archiver writes a 0-byte entry, so
          // the zip ships `ready` carrying silently empty files. on003574's
          // published archive has four 0-byte T1w scans exactly this way.
          //
          // But oversize happens too, and the first live run proved it: on004624
          // carries a stray upstream temp file whose object is 6,520,832 bytes
          // against a key declaring 6,488,064. Same verdict, same handling — the
          // content is not what was asked for and no rebuild will change that.
          function hollowObjectError(key, expected, actual) {
            var e = new Error("object is " + actual + " bytes; key declares " + expected);
            e.nemarAbsent = true;
            return e;
          }

          // S3 answered authoritatively that the object is not there, or we
          // proved the object present is not the content its key declares.
          // Anything else means we never got a usable answer.
          function isAbsentError(err) {
            if (!err) return false;
            var status = (err.$metadata && err.$metadata.httpStatusCode) || 0;
            return err.nemarAbsent === true || err.name === "NoSuchKey" || err.Code === "NoSuchKey" || status === 404;
          }

          function walkDir(dir, base) {
            base = base || "";
            var result = [];
            var entries = fs.readdirSync(dir, { withFileTypes: true });
            for (var i = 0; i < entries.length; i++) {
              var entry = entries[i];
              if (entry.name === ".git" || entry.name === ".github" || entry.name === "node_modules") continue;
              var rel = base ? base + "/" + entry.name : entry.name;
              var full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                result = result.concat(walkDir(full, rel));
              } else {
                result.push({ rel: rel, full: full });
              }
            }
            return result;
          }

          async function main() {
            console.log("Streaming archive for " + DATASET_ID + " v" + VERSION);

            var archive = archiver("zip", { zlib: { level: 1 } });
            var passThrough = new PassThrough();
            archive.pipe(passThrough);

            archive.on("warning", function (err) {
              console.warn("Archive warning:", err.message);
            });
            archive.on("error", function (err) {
              console.error("Archive error:", err.message);
              process.exitCode = 1;
            });
            passThrough.on("error", function (err) {
              console.error("Stream error:", err.message);
              process.exitCode = 1;
            });

            var s3 = new S3Client({ region: REGION });
            // #1491: the file name in a presigned download URL's path is the
            // browser's Save-As name, so putting the dataset id in the key's
            // file name (not just its directory) is what makes a download
            // named "<id>_v<version>.zip" instead of the pre-#1491 bare
            // "v<version>.zip". Must match archiveKey() in
            // nemarOrg/nemar-cli backend/src/services/s3.ts exactly -- that
            // is what readers look for first.
            var s3Key = DATASET_ID + "/archives/" + DATASET_ID + "_v" + VERSION + ".zip";

            var upload = new Upload({
              client: s3,
              params: {
                Bucket: BUCKET,
                Key: s3Key,
                Body: passThrough,
                ContentType: "application/zip",
                // #1518: NOT tagged here. nemar-actions-datasets' policy
                // grants PutObject but not PutObjectTagging, so a Tagging
                // param on the upload itself would 403 every build. Tagging
                // happens in its own best-effort step below, after the
                // upload has already succeeded.
              },
              // 6 parts in flight x 100 MB = ~600 MB buffered, comfortably under
              // the runner's memory; modestly faster than 4 for sub-threshold sets
              // now that >100 GB sets skip the build entirely (#752).
              queueSize: 6,
              partSize: 100 * 1024 * 1024,
            });

            var uploadDone = upload.done().catch(function (err) {
              console.error("S3 Upload error:", err.message);
              process.exitCode = 1;
              throw err;
            });

            var files = walkDir(".");
            console.log("Found " + files.length + " files");

            var annexed = 0;
            var regular = 0;
            // Content this build cannot obtain and no rebuild ever will. Two
            // sources, not one: objects the bucket positively reported it does
            // not have (404/NoSuchKey), AND objects it returned 200 for whose
            // ContentLength contradicts the size in their annex key — content
            // that is not what the key describes, in either direction (0-byte
            // per nemarOrg/nemar-cli#967, or oversized as on004624's stray temp
            // file turned out to be). The second kind is exactly as unrecoverable
            // as the first but arrives looking like a success. Both are an
            // expected, permanent state for datasets imported from upstream
            // archives that no longer hold every file they declare, rather than
            // a build fault (nemarOrg/nemar-cli#1038).
            var absent = 0;
            // Everything else: throttling, 403s, 5xx, mid-stream read errors.
            // Transient and retryable, so these MUST still fail the build.
            var unreadable = 0;

            // Prefetch window. The build was latency-bound, not bandwidth-bound:
            // one GetObject round trip per file, strictly in series. Measured on
            // on004624 (66,426 files / 19.3 GB) at ~5.5 files/s = ~183 ms each,
            // moving only ~1.6 MB/s — nowhere near what S3 will serve. A 60-min
            // cap buys ~19,800 files that way, so the dataset needed ~3.4 h and
            // was killed mid-build every time, producing no archive at all. The
            // dataset is not big, it is numerous.
            //
            // So: issue the GETs ahead of the writer while still appending in
            // strict file order (zip entry order must match, and archiver takes
            // one entry at a time). Each in-flight request's latency overlaps
            // the previous entries' write time instead of adding to it.
            //
            // Bounded on BOTH axes deliberately. Count alone is not enough: an
            // unconsumed response Body is an open socket holding buffered data,
            // so a window of 12 multi-GB files would sit on 12 stalled sockets
            // for minutes while the writer works through what came before. The
            // byte budget keeps large files effectively just-in-time (they are
            // bandwidth-bound anyway, so prefetching them wins nothing) and
            // spends the window where it actually pays: the many small files.
            var PREFETCH_MAX = 12;
            var PREFETCH_MAX_BYTES = 256 * 1024 * 1024;

            var pending = [];
            var nextToStart = 0;
            var pendingBytes = 0;

            function startNext() {
              var f = files[nextToStart++];
              var annexKey = resolveAnnexKey(f.full);
              var size = 0;
              var item = { rel: f.rel, full: f.full, annexKey: annexKey, size: 0, p: null };
              if (annexKey) {
                size = declaredKeySize(annexKey) || 0;
                item.size = size;
                // Settle rejections HERE rather than letting them ride as an
                // unhandled rejection until the writer catches up: the process
                // has an unhandledRejection handler that fails the build, and a
                // 404 on a prefetched file is an ordinary, expected outcome. The
                // error is carried as a value and rethrown in file order below,
                // so classification and ordering are unchanged.
                item.p = getAnnexObject(s3, DATASET_ID + "/objects/" + annexKey).then(
                  function (resp) {
                    return { resp: resp };
                  },
                  function (err) {
                    return { err: err };
                  },
                );
                pendingBytes += size;
              }
              pending.push(item);
            }

            for (var i = 0; i < files.length; i++) {
              // Top up the window before consuming, so the next request is
              // already in flight while this entry is being written.
              while (
                nextToStart < files.length &&
                pending.length < PREFETCH_MAX &&
                (pendingBytes < PREFETCH_MAX_BYTES || pending.length === 0)
              ) {
                startNext();
              }

              var item = pending.shift();
              var rel = item.rel;
              var annexKey = item.annexKey;
              if (annexKey) pendingBytes -= item.size;

              try {
                var entryDone = new Promise(function (resolve, reject) {
                  archive.once("entry", resolve);
                  archive.once("error", reject);
                });
                if (annexKey) {
                  var settled = await item.p;
                  if (settled.err) throw settled.err;
                  var resp = settled.resp;
                  var expected = declaredKeySize(annexKey);
                  if (expected !== null && typeof resp.ContentLength === "number" && resp.ContentLength !== expected) {
                    // Release the socket; we are not going to read this body.
                    if (resp.Body && typeof resp.Body.destroy === "function") resp.Body.destroy();
                    throw hollowObjectError(annexKey, expected, resp.ContentLength);
                  }
                  archive.append(resp.Body, { name: rel });
                } else {
                  archive.append(fs.createReadStream(item.full), { name: rel });
                }
                await entryDone;
                if (annexKey) annexed++;
                else regular++;
              } catch (err) {
                var isAbsent = isAbsentError(err);
                var skipped = absent + unreadable;
                if (isAbsent) absent++;
                else unreadable++;
                if (skipped < 10) {
                  console.warn("  Skipping " + rel + " (" + (isAbsent ? "absent" : "unreadable") + "): " + err.message);
                } else if (skipped === 10) {
                  console.warn("  (suppressing further skip warnings)");
                }
              }

              if ((annexed + regular + absent + unreadable) % 100 === 0) {
                console.log("  Progress: " + (annexed + regular + absent + unreadable) + "/" + files.length);
              }
            }

            await archive.finalize();
            await uploadDone;

            console.log("Archive complete: " + annexed + " annexed + " + regular + " regular + " + absent + " absent + " + unreadable + " unreadable");
            console.log("Uploaded to s3://" + BUCKET + "/" + s3Key);

            // Record the tally for the callback step, which reports completeness
            // alongside the archive's ready state.
            fs.writeFileSync("/tmp/archive-stats.json", JSON.stringify({
              annexed: annexed, regular: regular, absent: absent, unreadable: unreadable,
              declared: files.length
            }));

            // Sanity floor. A partial archive is legitimate — on006159 is ~70%
            // absent upstream and must still publish — but an archive where
            // essentially NOTHING was readable is not a partial dataset, it is a
            // failed build wearing a partial's clothes. That is the on007721
            // shape: a 2.3 MB zip served `ready` for a 23.6 GB dataset. A
            // read-path misconfiguration produces exactly this and would
            // otherwise exit 0 — note an IAM policy lacking s3:ListBucket makes
            // S3 answer NoSuchKey (not 403) for objects that DO exist, so no
            // amount of tightening isAbsentError catches it; only the magnitude
            // does. Deliberately set at near-total absence so a real partial can
            // never trip it. Ratio is over annexed objects only: `declared`
            // counts non-annexed metadata files that are always present and
            // would dilute it.
            var attempted = annexed + absent;
            var absentRatio = attempted > 0 ? absent / attempted : 0;

            if (unreadable > 0) {
              // We could not read objects the bucket may well still hold, so the
              // zip is unreliable. Fail: the wrapper deletes the partial and the
              // retry path rebuilds it.
              console.error("::error::" + unreadable + " annexed files could not be read from S3 (not 404); archive is unreliable");
              process.exitCode = 1;
            } else if (attempted > 0 && absentRatio >= 0.9) {
              console.error("::error::" + absent + " of " + attempted + " annexed objects (" + Math.round(absentRatio * 100) + "%) were absent from S3; that is a failed read path, not a partial dataset. Archive rejected.");
              process.exitCode = 1;
            } else if (absent > 0) {
              // Previously this also failed the build and the wrapper deleted the
              // zip, so a dataset missing one stray upstream file served no
              // archive at all. Availability is reported, not a precondition for
              // serving: keep the zip and publish it. Missing files are OMITTED
              // from the archive rather than written as 0-byte entries, so the
              // zip never lists content it does not carry. What is missing is
              // recorded out-of-band — the counts POSTed in the archive-ready
              // callback below, and the per-dataset
              // .nemar/availability-report.json (nemarOrg/nemar-cli#999). That
              // report is NOT in the zip: it is committed to the repo's `main`
              // branch, while this job checks out the immutable version tag.
              console.warn("::warning::" + absent + " of " + files.length + " files are absent upstream; archive is partial but usable");
            }
          }

          process.on("unhandledRejection", function (err) {
            console.error("Unhandled rejection:", err);
            process.exitCode = 1;
          });

          main().catch(function (err) {
            console.error("Fatal:", err);
            process.exitCode = 1;
          });
          ARCHIVE_SCRIPT

      - name: Stream archive to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
          NODE_PATH: /tmp/archive-deps/node_modules
        run: |
          set -euo pipefail
          # Idempotency guard (#670): skip the expensive re-download/re-zip/
          # re-upload if the archive already exists (a duplicate or manual
          # re-dispatch would otherwise rebuild it and could clobber the object
          # mid-stream). Normal publishes already dispatch this exactly once now
          # that the orchestrator's redundant generate_archive step was removed;
          # this is defense-in-depth. Use `force=true` (workflow_dispatch) to
          # rebuild over a partial/corrupt archive.
          FORCE="${{ github.event.client_payload.force || inputs.force || 'false' }}"
          # #1491: new key includes the dataset id in the file name. Writers
          # only ever write this name -- no old-name fallback here, that
          # exists solely on the read side (nemarOrg/nemar-cli
          # services/s3.ts resolveArchiveKey) during the rename sweep's
          # transition window.
          KEY="${DATASET_ID}/archives/${DATASET_ID}_v${VERSION}.zip"
          if [ "$FORCE" = "true" ]; then
            echo "force=true -- rebuilding archive regardless of existing object."
          else
            # Capture stderr so a 403/5xx is reported as such instead of being
            # silently treated as "absent -> rebuild" with a misleading log.
            set +e
            head_out=$(aws s3api head-object --bucket nemar --key "$KEY" 2>&1)
            head_rc=$?
            set -e
            if [ "$head_rc" -eq 0 ]; then
              echo "Archive already exists at s3://nemar/$KEY -- skipping rebuild."
              exit 0
            elif echo "$head_out" | grep -qiE "Not Found|404|NoSuchKey"; then
              echo "No existing archive at s3://nemar/$KEY -- building."
            else
              echo "::warning::head-object on $KEY returned an unexpected error (rc=$head_rc); proceeding to rebuild. Detail: $head_out"
            fi
          fi
          # Delete-on-failure (nemarOrg/nemar-cli#739): the streaming script
          # finalizes whatever it managed to append and completes the multipart
          # upload BEFORE it exits non-zero on an unreliable build, so a failed
          # run leaves a partial zip at the canonical key. Combined with the
          # idempotency guard above, that partial would make every subsequent
          # dispatch a no-op until a human passes force=true. Remove it on any
          # non-zero exit so a re-dispatch rebuilds cleanly. The normal publish
          # path is protected by the skip-if-exists guard (it never overwrites a
          # good archive); only an explicit force=true rebuild can reach here
          # with a prior good object, and that is a deliberate recovery action.
          #
          # Since nemarOrg/nemar-cli#1038 a build whose ONLY gaps are objects S3
          # reported absent (404) exits 0 and is kept: those files are gone
          # upstream, so deleting the zip and retrying can never recover them and
          # only leaves the dataset with no archive at all. Unreadable objects
          # (403/5xx/throttle) still exit non-zero and still delete, because the
          # content may well be there and a rebuild can succeed.
          set +e
          node /tmp/stream-archive.js
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::archive build failed (rc=$rc); removing any partial at s3://nemar/$KEY"
            aws s3 rm "s3://nemar/$KEY" || true
            exit "$rc"
          fi

      # #1518 backstop, separate from the upload step: nemar-actions-datasets'
      # current IAM policy grants s3:PutObject but not s3:PutObjectTagging, so
      # tagging cannot happen inline in the Upload call (that would 403 every
      # build). Best-effort and non-fatal: a failure here means the lifecycle
      # rule's noncurrent-version-expiration backstop will not cover this
      # object until the lead applies s3:PutObjectTagging (see the policy
      # JSON in this PR's description) and a later rebuild retags it. It does
      # NOT affect the per-build cleanup step below, which deletes by version
      # id directly and does not depend on tags.
      - name: Tag archive object for lifecycle (#1518, best-effort)
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        run: |
          set -euo pipefail
          KEY="${DATASET_ID}/archives/${DATASET_ID}_v${VERSION}.zip"
          set +e
          TAG_OUT=$(aws s3api put-object-tagging --bucket nemar --key "$KEY" \
            --tagging '{"TagSet":[{"Key":"nemar-kind","Value":"archive"}]}' 2>&1)
          TAG_RC=$?
          set -e
          if [ "$TAG_RC" -ne 0 ]; then
            echo "::warning::could not tag $KEY with nemar-kind=archive ($TAG_OUT); the lifecycle backstop will not cover this object until the lead applies s3:PutObjectTagging."
          else
            echo "Tagged $KEY with nemar-kind=archive."
          fi

      # Mirror of run-generate-zarr.yml's zarr-ready callback. Records the
      # latest-only archive state on the dataset's D1 row so the observability
      # dashboard (dashboard.nemar.org/observability) reports archive coverage
      # live, instead of only after the admin archive-sweep backfill.
      # (nemarOrg/nemar-cli#695 / #696.)
      - name: POST callback (archive-ready)
        id: post-success
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
          CALLBACK_TOKEN: ${{ secrets.NEMAR_WEBHOOK_TOKEN }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || inputs.callback_url || 'https://api.nemar.org/webhooks/archive-ready' }}
        run: |
          set -euo pipefail
          if [ -z "$CALLBACK_URL" ]; then
            echo "No callback URL configured; skipping callback POST"
            exit 0
          fi
          KEY="${DATASET_ID}/archives/${DATASET_ID}_v${VERSION}.zip"
          # The zip is present (just uploaded, or already existed on the
          # idempotent skip path). Read its size for datasets.archive_size; a
          # HEAD failure just omits the size (the Worker tolerates a null size).
          SIZE=$(aws s3api head-object --bucket nemar --key "$KEY" --query ContentLength --output text 2>/dev/null || echo "")
          if [ -n "$SIZE" ] && [ "$SIZE" != "None" ]; then
            printf '{"dataset_id":"%s","status":"ready","version":"%s","size":%s}' "$DATASET_ID" "$VERSION" "$SIZE" > /tmp/archive-callback.json
          else
            printf '{"dataset_id":"%s","status":"ready","version":"%s"}' "$DATASET_ID" "$VERSION" > /tmp/archive-callback.json
          fi
          # Send the completeness tally with the ready state so D1 can tell a
          # partial archive from a complete one (nemarOrg/nemar-cli#1038).
          # Without this the two are indistinguishable downstream and the only
          # trace of a partial build is a warning in a green Actions log. The
          # per-file breakdown stays in the dataset's own
          # .nemar/availability-report.json; these are just the counts.
          #
          # The stats file is absent on the idempotent skip path, where the
          # stream script never ran — then the base payload goes as-is and the
          # Worker leaves the existing completeness columns untouched.
          if [ -f /tmp/archive-stats.json ]; then
            echo "archive completeness: $(cat /tmp/archive-stats.json)"
            # A merge failure must not cost us the callback entirely: the zip is
            # already on S3, so fall back to the base payload and warn.
            if jq -c --slurpfile s /tmp/archive-stats.json \
              '. + {annexed: $s[0].annexed, absent: $s[0].absent, unreadable: $s[0].unreadable, declared: $s[0].declared, complete: (($s[0].absent + $s[0].unreadable) == 0)}' \
              /tmp/archive-callback.json > /tmp/archive-callback-merged.json 2>/dev/null; then
              mv /tmp/archive-callback-merged.json /tmp/archive-callback.json
            else
              echo "::warning::could not merge completeness into the callback payload; sending base payload"
            fi
          fi
          # --connect-timeout/--max-time cap a hung Worker. On non-2xx capture the
          # body so the failure is unambiguous: the zip IS on S3, the Worker
          # refused the callback (auth, dataset-not-in-D1 -> 404, bad status).
          HTTP_STATUS=$(curl -sS -o /tmp/archive-callback-response.txt \
            -w "%{http_code}" \
            --connect-timeout 10 --max-time 30 \
            -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: ${CALLBACK_TOKEN}" \
            --data @/tmp/archive-callback.json) || HTTP_STATUS="000"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error title=archive-ready callback rejected::Archive uploaded to S3 but the Worker callback at $CALLBACK_URL returned HTTP $HTTP_STATUS. NOT an archive failure. Response body follows."
            cat /tmp/archive-callback-response.txt || true
            echo
            exit 1
          fi
          echo "Callback POSTed to $CALLBACK_URL (HTTP $HTTP_STATUS, size=${SIZE:-unknown})"

      # nemarOrg/nemar-cli#1518: only the latest version keeps a retained
      # archive. Runs here (in the workflow), not in the backend webhook,
      # because this job already holds the AWS credentials the upload used
      # and because the Worker's per-invocation S3 subrequest budget
      # (services/s3.ts's applyObjectLockBatch documents the same Cloudflare
      # Workers cap) is the wrong place to run an unbounded
      # list-object-versions + delete-objects pair -- a dataset with many
      # historical rebuilds could blow that budget inside a webhook call
      # that also has to answer the workflow's HTTP request. Gated on the
      # PREVIOUS step's own success (not just `success()`, which is also
      # true before this step runs) so cleanup only ever follows a
      # CONFIRMED-complete new zip and a D1 row that already reflects it --
      # never delete the only-known-good archive because of a step ordering
      # assumption.
      #
      # PR review finding (data loss, reproduced): the earlier version of
      # this step kept only the exact key `<id>/archives/<id>_v$VERSION.zip`
      # and deleted everything else under the prefix. `concurrency` here is
      # per (dataset_id, version), so two versions of the SAME dataset can
      # finish in either order -- a retry or manual re-dispatch of an OLDER
      # version completing AFTER a newer one would have deleted the real
      # latest archive, and so would a legacy-named (pre-#1491) archive for
      # a version newer than the one just built. Fixed by comparing the
      # SEMANTIC VERSION parsed from each key's file name against $VERSION,
      # not by string-equality against one canonical key:
      #   - version < $VERSION (strictly): always deleted (a superseded
      #     build, whatever its name or current/noncurrent state).
      #   - version == $VERSION: every entry is deleted EXCEPT the one
      #     current, new-name Version entry -- that is the single object
      #     this run is allowed to keep. This covers noncurrent versions and
      #     delete markers of both the new and legacy names for this exact
      #     version, and the legacy-name object for this exact version once
      #     the new-name object's presence as the current version is
      #     confirmed by this same listing (see the REQUIRE_KEEP guard
      #     below -- if that object is not found, NOTHING is deleted and the
      #     step fails loudly rather than guess).
      #   - version > $VERSION (strictly): NEVER touched. This is what
      #     protects a genuinely newer archive (new- or legacy-named) from
      #     an out-of-order or retried older build's cleanup; the residual
      #     cost is that such an archive is only actually cleaned up the
      #     next time ITS OWN version's build runs, not by this one.
      #   - a key whose file name does not parse as either shape: reported
      #     (a ::warning::) and left untouched, never deleted.
      #
      # PR review finding (permissions, verified against the deployed IAM
      # policy for nemar-actions-datasets): that identity has no
      # s3:ListBucketVersions or s3:DeleteObjectVersion. Both AWS calls below
      # degrade to a non-fatal ::warning:: + exit 0 on Access Denied, so a
      # dataset simply keeps its older archives until the lead applies the
      # policy in this PR's description -- it must never fail the job (the
      # zip itself is already uploaded and correct).
      #
      # Idempotent: it lists the CURRENT state of `<id>/archives/` every
      # time and recomputes the same plan from that snapshot, so a re-run
      # (retry, or a second dispatch landing after this one) either finds
      # nothing left to remove or reaches the same answer again.
      - name: Clean up older archive versions (#1518)
        if: steps.post-success.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        run: |
          set -euo pipefail
          PREFIX="${DATASET_ID}/archives/"
          NEW_NAME="${DATASET_ID}_v${VERSION}.zip"
          echo "Cleaning up ${PREFIX} for dispatched version ${VERSION} (keeping only the current ${NEW_NAME})"

          set +e
          LIST_OUT=$(aws s3api list-object-versions --bucket nemar --prefix "$PREFIX" --output json 2>&1)
          LIST_RC=$?
          set -e
          if [ "$LIST_RC" -ne 0 ]; then
            if echo "$LIST_OUT" | grep -qi "AccessDenied"; then
              echo "::warning::list-object-versions denied for ${PREFIX} (missing s3:ListBucketVersions?); skipping cleanup until the lead applies the IAM policy in this PR's description."
              exit 0
            fi
            echo "::error::list-object-versions failed for ${PREFIX}: ${LIST_OUT}"
            exit 1
          fi
          echo "$LIST_OUT" > /tmp/archive-versions.json

          # Never touch anything outside <id>/archives/: list-object-versions
          # is already prefix-scoped above, and this guard fails loudly if a
          # future edit widens the prefix by mistake rather than silently
          # deleting the wrong dataset's objects.
          OUT_OF_SCOPE=$(jq --arg p "$PREFIX" \
            '[(.Versions // []), (.DeleteMarkers // [])] | flatten | map(select(.Key | startswith($p) | not)) | length' \
            /tmp/archive-versions.json)
          if [ "$OUT_OF_SCOPE" != "0" ]; then
            echo "::error::list-object-versions returned $OUT_OF_SCOPE key(s) outside $PREFIX; refusing to delete anything"
            exit 1
          fi

          # Plan the cleanup from the listing: parse each key's file name
          # (new "<id>_v<ver>.zip" or legacy "v<ver>.zip"), compare its
          # version against the dispatched $VERSION with a numeric (not
          # lexical) semver comparison, and classify. See the step comment
          # above for the exact rule per bucket.
          jq -c \
            --arg id "$DATASET_ID" \
            --arg prefix "$PREFIX" \
            --arg dispatched "$VERSION" '
            def isSemver:
              test("^[0-9]+\\.[0-9]+\\.[0-9]+$");
            def toParts:
              split(".") | map(tonumber);
            def semverCmp($a; $b):
              ($a | toParts) as $pa | ($b | toParts) as $pb |
              if $pa[0] != $pb[0] then ($pa[0] - $pb[0])
              elif $pa[1] != $pb[1] then ($pa[1] - $pb[1])
              else ($pa[2] - $pb[2])
              end;
            def parseArchiveKey:
              (.Key[($prefix | length):]) as $fn |
              ($id + "_v") as $newPrefix |
              if ($fn | startswith($newPrefix)) and ($fn | endswith(".zip")) then
                ($fn[($newPrefix | length):-4]) as $v |
                if ($v | isSemver) then {kind:"new", version:$v} else {kind:"unparsed", version:null} end
              elif ($fn | startswith("v")) and ($fn | endswith(".zip")) then
                ($fn[1:-4]) as $v |
                if ($v | isSemver) then {kind:"legacy", version:$v} else {kind:"unparsed", version:null} end
              else
                {kind:"unparsed", version:null}
              end;
            ( [(.Versions // [])[] | . + {isMarker:false}]
              + [(.DeleteMarkers // [])[] | . + {isMarker:true}]
            ) | map(. + parseArchiveKey) | map(
              if .kind == "unparsed" then . + {action:"report"}
              elif (semverCmp(.version; $dispatched) < 0) then . + {action:"delete"}
              elif (semverCmp(.version; $dispatched) > 0) then . + {action:"keep-newer"}
              elif (.kind == "new") and (.IsLatest == true) and (.isMarker == false) then
                . + {action:"keep-current"}
              else . + {action:"delete"}
              end
            )
          ' /tmp/archive-versions.json > /tmp/archive-plan.json

          jq -r '.[] | select(.action == "report") | "  " + .Key + " (versionId " + .VersionId + ")"' /tmp/archive-plan.json \
            | while IFS= read -r line; do echo "::warning::unparseable archive key under ${PREFIX}, left untouched: ${line}"; done

          KEEP_COUNT=$(jq '[.[] | select(.action == "keep-current")] | length' /tmp/archive-plan.json)
          if [ "$KEEP_COUNT" -ne 1 ]; then
            echo "::error::expected exactly 1 current object named ${NEW_NAME} under ${PREFIX}, found ${KEEP_COUNT}; refusing to delete anything until this is understood (a fresh upload should always leave exactly one)."
            exit 1
          fi

          jq -c '[.[] | select(.action == "delete") | {Key, VersionId}]' /tmp/archive-plan.json > /tmp/archive-to-delete.json

          COUNT=$(jq 'length' /tmp/archive-to-delete.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "Nothing to clean up under ${PREFIX} (already retention-clean)."
            exit 0
          fi
          echo "Deleting ${COUNT} object version(s):"
          jq -r '.[] | "  " + .Key + "  (versionId " + .VersionId + ")"' /tmp/archive-to-delete.json

          # Loop in case a dataset somehow exceeds 1000 stale versions; the
          # common case is one batch.
          REMAINING=$(jq -c '.' /tmp/archive-to-delete.json)
          while [ "$(echo "$REMAINING" | jq 'length')" -gt 0 ]; do
            echo "$REMAINING" | jq -c '{Objects: .[0:1000], Quiet: false}' > /tmp/archive-delete-batch.json
            set +e
            DEL_OUT=$(aws s3api delete-objects --bucket nemar --delete file:///tmp/archive-delete-batch.json --output json 2>&1)
            DEL_RC=$?
            set -e
            if [ "$DEL_RC" -ne 0 ]; then
              if echo "$DEL_OUT" | grep -qi "AccessDenied"; then
                echo "::warning::delete-objects denied for ${PREFIX} (missing s3:DeleteObjectVersion?); leaving old archive versions in place until the lead applies the IAM policy in this PR's description."
                exit 0
              fi
              echo "::error::delete-objects failed for ${PREFIX}: ${DEL_OUT}"
              exit 1
            fi
            echo "$DEL_OUT" > /tmp/archive-delete-result.json
            echo "delete-objects result:"
            cat /tmp/archive-delete-result.json
            ERR_COUNT=$(jq '.Errors // [] | length' /tmp/archive-delete-result.json)
            if [ "$ERR_COUNT" != "0" ]; then
              ACCESS_DENIED_COUNT=$(jq '[.Errors[] | select(.Code == "AccessDenied")] | length' /tmp/archive-delete-result.json)
              if [ "$ACCESS_DENIED_COUNT" = "$ERR_COUNT" ]; then
                echo "::warning::${ERR_COUNT} object version(s) denied by IAM under ${PREFIX}; leaving them in place until the lead applies the policy in this PR's description."
                exit 0
              fi
              echo "::error::${ERR_COUNT} object version(s) failed to delete under ${PREFIX} (not all AccessDenied)"
              exit 1
            fi
            REMAINING=$(echo "$REMAINING" | jq -c '.[1000:]')
          done
          echo "Cleanup complete: ${PREFIX} now holds only the current version of ${NEW_NAME} (plus any strictly newer version this run correctly left untouched)."

      - name: POST failure callback (best-effort)
        # Only on a HARD failure (clone/install/stream crash, an incomplete
        # archive, or the success callback POST itself failing) -- so an
        # archive that didn't fully build is recorded as 'failed' rather than
        # silently advertised. Best-effort; tolerate a 404.
        if: failure() && steps.post-success.outcome != 'success'
        env:
          CALLBACK_TOKEN: ${{ secrets.NEMAR_WEBHOOK_TOKEN }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || inputs.callback_url || 'https://api.nemar.org/webhooks/archive-ready' }}
        run: |
          set -euo pipefail
          printf '{"dataset_id":"%s","status":"failed","version":"%s"}' "$DATASET_ID" "$VERSION" > /tmp/archive-fail.json
          curl -sS --connect-timeout 10 --max-time 30 -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: ${CALLBACK_TOKEN}" \
            --data @/tmp/archive-fail.json || true
